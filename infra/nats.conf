# ============================================================
# BusTracker NATS 서버 설정
# ============================================================

# 클라이언트 연결 설정
listen: 0.0.0.0:4222

server_name: bustracker-nats

# ============================================================
# 연결 타임아웃
# ============================================================
ping_interval: "30s"
ping_max: 3
write_deadline: "10s"

# ============================================================
# 연결 제한
# ============================================================
max_connections: 1000

# 정류장 검색 요청/응답 페이로드 크기 (JSON 배열 기준 여유 있게 설정)
max_payload: 1MB

# ============================================================
# 인증 (단일 토큰 방식)
# 환경변수 NATS_AUTH_TOKEN으로 주입
# ============================================================
authorization {
    token: $NATS_AUTH_TOKEN
    timeout: 5
}

# ============================================================
# 모니터링 (운영 환경에서는 내부망에서만 접근 허용)
# ============================================================
http_port: 8222

# ============================================================
# 로깅
# ============================================================
logtime: true
log_file: "/var/log/nats/nats.log"
log_size_limit: 100MB
logfile_max_num: 5
