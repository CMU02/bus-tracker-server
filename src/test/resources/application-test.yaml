# 테스트 환경 전용 설정
# bustracker.nats.url 미설정 → @ConditionalOnProperty 미충족 → NATS 빈 비활성화
# MySQL 대신 H2 인메모리 DB 사용

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

public-data-portal:
  key:
    encode: ""
